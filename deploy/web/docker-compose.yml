# Deployment of the web editor on one host, behind TLS.
#
# Two containers: the daemon (which serves the editor, the bundle and the
# documents) and Caddy (which terminates TLS and is the only thing exposed).
# Everything the deployment needs to survive a redeploy is in the two named
# volumes, so `docker compose down` loses nothing and `up -d` restores it.
#
# Run it from this directory:
#   cp .env.example .env      # then fill DOMAIN, ADMIN_USERNAME, ADMIN_PASSWORD
#   docker compose up -d
#
# Read README.md next to this file for what to do before and after.

name: openpencil

services:
  openpencil:
    image: ${OPENPENCIL_IMAGE:-openpencil-web-rust:local}
    # Built from the release tag; see README.md for both ways to get it onto the
    # host (build here, or copy the CI artifacts).
    build:
      context: ../..
      dockerfile: Dockerfile.web-rust
    restart: unless-stopped
    environment:
      # `online` is the multi-account mode: every request is attributed to a
      # verified account and served against that account's own documents. The
      # single-user `local` mode has no login and must never face the internet.
      OPENPENCIL_SERVE_MODE: online
      OPENPENCIL_SERVE_PORT: "3100"
      # Accounts and sessions live here (SQLite). Losing this volume loses every
      # account, so it is one of the two things to back up.
      OPENPENCIL_ONLINE_DATA_DIR: /data
      # The documents themselves, plus their index. Moving one without the other
      # is what the store's own docs warn about, so both live on one volume.
      NORKA_DOCUMENTS_DIR: /documents
      # The one origin the browser will be served from. Sensitive POSTs and the
      # online-mode policy both read it, so it must match the URL people type.
      OPENPENCIL_WEB_ALLOWED_ORIGINS: https://${DOMAIN:?set DOMAIN in .env}
      # The first administrator, created at start-up if the store is fresh —
      # the container's answer to `op admin create`, which needs a terminal.
      NORKA_ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      NORKA_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - openpencil-data:/data
      - openpencil-documents:/documents
    # Not published: Caddy reaches it over the compose network, and nothing else
    # should. Publishing 3100 would put the credential-less health route on the
    # internet.
    expose:
      - "3100"
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [openpencil]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]

volumes:
  openpencil-data:
  openpencil-documents:
  # Caddy's certificates. Losing this volume is not data loss; it is a re-issue
  # against Let's Encrypt's rate limit, so keep it.
  caddy-data:
  caddy-config:

networks:
  web:
